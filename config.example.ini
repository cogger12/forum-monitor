# Copy to config.ini and edit. Secrets are better in the environment
# (see README) than in this file.

[forum]
url = https://www.northeastshooters.com/xen/forums/wts-wtt-handguns.213/
# How often to check. Values under 300 seconds are raised to 300.
poll_seconds = 900
# Extra pages of newest threads, only if a whole page is unseen.
max_pages = 2
state_db = data/state.sqlite

[notify]
# Full URL of your ntfy topic, for example https://ntfy.example.com/forum-monitor-some-long-secret
ntfy_url =
# Bearer token from `ntfy token add`. Leave empty when the topic allows anonymous publish.
ntfy_token =
# discord, slack, or json (generic POST of the alert text)
webhook_url =
webhook_format = json

smtp_host =
smtp_port = 587
smtp_user =
smtp_password =
smtp_from =
smtp_to =
